# nginx vhost for Redactly.
#
# Install as an HTTP-only vhost and let certbot add the TLS block and redirect:
#
#   sudo cp deploy/nginx/redact.mahwiz.me.conf /etc/nginx/sites-available/redactly
#   sudo ln -sf /etc/nginx/sites-available/redactly /etc/nginx/sites-enabled/redactly
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d redact.mahwiz.me
#
# TLS is not optional. WebMCP requires a secure context, so over plain HTTP
# `document.modelContext` never appears and the tools cannot register at all.

server {
    listen 80;
    listen [::]:80;
    server_name redact.mahwiz.me;

    # Requests are small and this app takes no uploads; the interesting traffic
    # is long-lived rather than large.
    location / {
        proxy_pass http://127.0.0.1:28419;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The setting most likely to break this deploy. `request_field_unmask`
        # blocks server-side until a human approves or denies, and nginx defaults
        # this to 60s — shorter than REDACTLY_APPROVAL_TIMEOUT_SECONDS. At the
        # default, a reviewer who reads carefully gets the tool call cut off
        # under them, which looks like an application bug and is not one.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # The owner queue long-polls in 20s windows. Buffering holds the response
        # back and delays the approval modal appearing.
        proxy_buffering off;
    }
}
