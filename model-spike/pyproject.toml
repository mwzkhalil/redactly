[project]
name = "redactly-model-spike"
version = "0.1.0"
description = "Reproducible ONNX PII detector evaluation for Redactly"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "transformers>=4.48,<6",
]

[project.optional-dependencies]
gliner = [
  "gliner==0.2.25",
  "onnxscript>=0.3,<1",
]
