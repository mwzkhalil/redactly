[project]
name = "redactly-api"
version = "0.1.0"
description = "Redactly policy service: owns raw document text, PII detection, and reveal state machines"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "cryptography>=43,<47",
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "transformers>=4.48,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
